<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متابعة الطلب | Arena Sport</title>
  <link rel="icon" type="image/jpeg" href="assets/images/logo-arena-sport.jpg">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .thankyou-wrapper {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px 16px;
    }
    .thankyou-card {
      background: #FFFFFF;
      border-radius: var(--radius-2xl);
      padding: 30px 20px;
      border: 1px solid var(--color-gray-200);
      box-shadow: var(--shadow-floating);
      text-align: center;
    }
    .success-icon-badge {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ECFDF5;
      border: 3px solid #10B981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      color: #10B981;
      animation: pop-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop-bounce {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .thankyou-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--color-dark);
      margin-bottom: 8px;
    }
    .thankyou-subtitle {
      font-size: 13.5px;
      color: var(--color-gray-500);
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .order-summary-box {
      background: #F8FAFC;
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      text-align: right;
      margin-bottom: 22px;
    }
    .summary-heading {
      font-size: 14px;
      font-weight: 800;
      color: var(--color-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-gray-200);
      padding-bottom: 8px;
    }
    .order-ref-pill {
      font-family: var(--font-latin);
      font-size: 11.5px;
      background: var(--color-primary-black);
      color: #FFFFFF;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .summary-line-title {
      color: var(--color-gray-500);
    }
    .summary-line-val {
      font-weight: 700;
      color: var(--color-dark);
    }
    .whatsapp-confirm-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 50px;
      background-color: #25D366;
      color: #FFFFFF;
      text-decoration: none;
      border-radius: var(--radius-full);
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .whatsapp-confirm-btn:hover {
      background-color: #20BD5A;
      transform: translateY(-1.5px);
    }
    .back-home-btn {
      display: block;
      color: var(--color-gray-500);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
    }
    .back-home-btn:hover {
      color: var(--color-dark);
    }
  </style>

  <!-- Meta Pixel Script -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '1422859033068055');
  </script>
<script src="assets/js/tracking.js" defer></script><script src="assets/js/receipt.js" defer></script></head>
<body style="background-color: #F1F5F9; padding-bottom: 20px;">

  <!-- Simple Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 12px 16px; text-align: center;">
    <a href="index.html" class="brand-center">
      <img src="assets/images/logo-arena-sport.jpg" alt="ARENA SPORT DZ" style="height: 38px; width: auto; margin-bottom: 2px;">
      <span class="brand-title" style="font-size: 16px;">ARENA SPORT</span>
    </a>
  </header>

  <div class="thankyou-wrapper">
    <div class="thankyou-card">
      <div class="success-icon-badge">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>

      <h1 class="thankyou-title">جارٍ التحقق من طلبك…</h1>
      <p class="thankyou-subtitle"></p>

      <!-- Order Details Box -->
      <div class="order-summary-box" hidden>
        <div class="summary-heading">
          <span>تفاصيل طلبيتك</span>
          <span class="order-ref-pill" id="orderRefDisplay">ARENA-00000</span>
        </div>

        <div class="summary-line">
          <span class="summary-line-title">الاسم واللقب:</span>
          <span class="summary-line-val" id="summaryClientName">—</span>
        </div>

        <div class="summary-line">
          <span class="summary-line-title">رقم الهاتف:</span>
          <span class="summary-line-val latin-num" id="summaryPhone">—</span>
        </div>

        <div class="summary-line">
          <span class="summary-line-title">الموديل المختار:</span>
          <span class="summary-line-val" id="summaryVariant">—</span>
        </div>

        <div class="summary-line">
          <span class="summary-line-title">مكان التوصيل:</span>
          <span class="summary-line-val" id="summaryLocation">—</span>
        </div>

        <div class="summary-line">
          <span class="summary-line-title">طريقة الاستلام:</span>
          <span class="summary-line-val" id="summaryDeliveryType">—</span>
        </div>

        <div class="breakdown-divider" style="margin: 10px 0;"></div>

        <div class="summary-line" style="font-size: 15px;">
          <span class="summary-line-title" style="font-weight: 800; color: #111827;">المبلغ الإجمالي عند الاستلام:</span>
          <span class="summary-line-val latin-num" id="summaryTotal" style="color: #1E3A8A; font-size: 18px; font-weight: 800;">—</span>
        </div>
      </div>

      <!-- Quick WhatsApp Confirmation -->
      <a href="#" id="whatsappBtn" class="whatsapp-confirm-btn" style="display:none" hidden target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
        </svg>
        <span>تأكيد طلبيتي فوراً عبر واتساب</span>
      </a>

      <a href="index.html" class="back-home-btn">العودة إلى الصفحة الرئيسية ←</a>
    </div>
  </div>

</body>
</html>
